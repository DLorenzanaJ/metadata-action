name: AI Issue Triage
on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Clasificar issue con Gemini
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const issueTitle = context.payload.issue.title;
            const issueBody = context.payload.issue.body || '';
            
            const prompt = `Eres un mantenedor del proyecto docker/metadata-action.
            Clasifica el siguiente issue en UNA de estas etiquetas:
            - kind/bug (si es un error o defecto)
            - kind/enhancement (si es una nueva característica o mejora)
            - kind/docs (si es de documentación)
            - question (si es consulta o soporte)
            
            Responde ÚNICAMENTE con el nombre de la etiqueta, sin comillas ni texto adicional.
            
            Título: ${issueTitle}
            Cuerpo: ${issueBody}`;
            
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
              })
            });
            
            const data = await response.json();
            const label = data.candidates[0].content.parts[0].text.trim();
            
            const validLabels = ['kind/bug', 'kind/enhancement', 'kind/docs', 'question'];
            if (validLabels.includes(label)) {
              console.log(`Aplicando etiqueta: ${label}`);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [label]
              });
            } else {
              console.log(`La IA devolvió un formato inválido: ${label}`);
            }